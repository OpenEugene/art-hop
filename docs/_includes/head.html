{% assign og_title = include.title | default: site.title %}
{% assign og_desc = site.description | default: "" %}
{% if site.description %}<meta name="description" content="{{ og_desc | escape }}">{% endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ og_title | escape }}">
<meta property="og:description" content="{{ og_desc | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/og-image.jpg' | absolute_url }}">
<meta property="og:image:width" content="1836">
<meta property="og:image:height" content="961">
<meta property="og:image:alt" content="Warehouse District Art Hop map">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title | escape }}">
<meta name="twitter:description" content="{{ og_desc | escape }}">
<meta name="twitter:image" content="{{ '/assets/og-image.jpg' | absolute_url }}">
{% if site.favicon %}<link rel="icon" href="{{ site.favicon | relative_url }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;700&family=Newsreader:wght@400;700&family=Staatliches&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
