{% assign cfg = site.data.site %}
<div class="newsletter">
  <h2>Sign up for Art Hop emails</h2>
  {% if cfg.newsletter.formAction and cfg.newsletter.formAction != "" %}
  <form method="post" action="{{ cfg.newsletter.formAction }}" target="_blank">
    <input type="email" name="EMAIL" placeholder="Email address" required autocomplete="email">
    <input type="text" name="email_address_check" value="" style="display:none" tabindex="-1" autocomplete="off">
    <input type="hidden" name="locale" value="en">
    <button type="submit">Sign up</button>
  </form>
  {% elsif cfg.newsletter.embedUrl and cfg.newsletter.embedUrl != "" %}
  <iframe src="{{ cfg.newsletter.embedUrl }}" title="Mailing list signup" width="100%" height="320" frameborder="0" scrolling="auto"></iframe>
  {% else %}
  <p><a class="btn" href="mailto:{{ cfg.email }}?subject=Add%20me%20to%20the%20Art%20Hop%20mailing%20list">Email us to join the list</a></p>
  {% endif %}
</div>
