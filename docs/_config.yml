# Site configuration, rendered by `wikidown export-html` (not GitHub's
# Jekyll builder: the templates use wiki_body / wiki_title and the
# wikidown.layouts keys below, which only export-html understands).
# Deployed by .github/workflows/pages.yml; GitHub Settings → Pages →
# Source must be "GitHub Actions".
#
# Preview locally: wikidown export-html --output _site --clean

title: "Warehouse District Art Hop"
description: "The Warehouse District Art Hop: a monthly art walk through the studios, galleries, and shops of west Eugene, Oregon."
# Uncomment to add a GitHub link to the top bar:
# repository_url: https://github.com/<owner>/<repo>
# Favicon (path relative to the wiki root):
favicon: /assets/icons/favicon.ico

# Home is the site root (index.html) and uses _layouts/landing.html; every
# other page uses _layouts/wikidown.html.
# To leave subtrees out of the published site, add exclude_from_site:
# a list of page paths such as /Internal-Notes.
wikidown:
  root_page: /Home
  layouts:
    /Home: landing

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# All three ship with GitHub Pages' builder — nothing to install.
plugins:
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-default-layout

# Rewrites Wikidown's relative `[Page](../Folder/Page.md)` links to the
# generated .html URLs.
relative_links:
  enabled: true
  collections: false

# Wikidown pages carry no front matter; the title comes from the first
# `# Heading` and stays in the body.
titles_from_headings:
  enabled: true
  strip_title: false

defaults:
  - scope:
      path: ""
    values:
      layout: wikidown

# Jekyll skips dot-folders by default; Wikidown keeps images here.
include:
  - .attachments

exclude:
  - vendor
  - node_modules
